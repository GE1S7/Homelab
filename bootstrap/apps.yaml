apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/GE1S7/Homelab.git
    targetRevision: main
    path: apps
  syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: "*"
      kind: Application
      jsonPointers:
        - /spec/syncPolicy/automated
        - /metadata/annotations/argocd.argoproj.io~1refresh
        - /operation



