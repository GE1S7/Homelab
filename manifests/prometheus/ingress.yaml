apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-ingress
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - prometheus
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: promtheus
            port:
              number: 9090

